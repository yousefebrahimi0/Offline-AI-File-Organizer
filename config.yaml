# Offline AI File Organizer Configuration
# Supports ANY OpenAI-compatible local or cloud LLM, plus native Anthropic & Gemini.

llm:
  # Provider presets:
  #   - "lm_studio"         (default: http://localhost:1234/v1)
  #   - "ollama"            (default: http://localhost:11434/v1)
  #   - "llama_cpp"         (default: http://localhost:8080/v1)
  #   - "openai"            (default: https://api.openai.com/v1)
  #   - "openrouter"        (default: https://openrouter.ai/api/v1)
  #   - "anthropic"         (default: https://api.anthropic.com/v1/messages)
  #   - "gemini"            (default: https://generativelanguage.googleapis.com/v1beta)
  #   - "openai_compatible" (any custom base_url)
  provider: "lm_studio"

  # Leave empty ("") to use the provider's default URL
  base_url: ""

  # Leave as "auto" to auto-detect the first loaded model from local /v1/models
  # Or set any model name, e.g.:
  #   "mistral-7b-instruct", "llama3.2", "qwen2.5:7b", "qwen2.5-vl",
  #   "gpt-4o-mini", "claude-3-5-haiku-latest", "gemini-2.0-flash"
  model: "auto"

  # Optional API key (recommended: set via environment variable instead)
  # Env vars checked automatically: LLM_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY,
  # ANTHROPIC_API_KEY, GEMINI_API_KEY
  api_key: ""

  temperature: 0.2
  max_tokens: 120
  timeout: 45

organizer:
  max_content_length: 3000
  organize_folder_name: "Organized"
  # Set to true (or pass --include-images) to organize PNG/JPG/WEBP via Vision LLM or OCR
  enable_images: false
  use_vision_model: true
  ignore_folders:
    - "Organized"
    - ".git"
    - "__pycache__"
    - "node_modules"
    - ".venv"
    - "venv"
  # Bounded concurrent analysis; actual file moves remain serialized.
  watch_workers: 2
  watch_stability_seconds: 1.5
  # The default "smart" profile permits one top-level folder and one approved
  # subfolder. "simple" uses only top-level categories; "custom" uses this map.
  profile: "smart"
  detect_duplicates: true
  cache_ai_results: true
  # Optional: {document_date} and {vendor} use locally extracted hints
  naming_template: "{title} ({date})"
  image_max_dimension: 1024
  image_quality: 76
  ocr_first_images: true
  ocr_scanned_pdfs: true
  # Deterministic filename rules are applied before calling an AI model.
  # rules: [{pattern: "*invoice*.pdf", category: Finance, subcategory: Invoices}]
  rules: []
  smart_subcategories:
    Work: [Projects, Reports, Contracts]
    Finance: [Invoices, Receipts, Statements, Taxes]
    Personal: [Identity, Legal, Medical]
    Education: [Courses, Research]
    Photos: [Travel, People, Receipts]
    Projects: [Plans, Designs]
    Legal: [Contracts, Agreements]
    Medical: [Records, Prescriptions]
    Archive: [Documents]
  categories:
    - "Work"
    - "Personal"
    - "Finance"
    - "Medical"
    - "Education"
    - "Legal"
    - "Photos"
    - "Projects"
    - "Archive"
    - "Miscellaneous"
